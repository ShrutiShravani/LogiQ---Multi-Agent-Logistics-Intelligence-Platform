services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - DB_URI=postgresql://user:password@postgres:5432/logistics_db
      - PYTHONPATH=/app
    volumes:
      - .:/app  # This is the most important line
    depends_on:
      - redis
      - postgres
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
  

  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: logistics_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"

  mlflow_server:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow_service
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow_server:5000,mlflow_server,localhost:5000,localhost,127.0.0.1:5000,127.0.0.1"
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlflow/mlruns
      --host 0.0.0.0
      --port 5000
      --allowed-hosts "mlflow_server:5000,mlflow_server,localhost:5000,localhost,127.0.0.1:5000,127.0.0.1"
  
volumes:
  postgres_data:
  redis_data:
  mlflow_data:
  processed_data: